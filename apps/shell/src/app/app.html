<div class="layout-wrapper">
    <div class="layout-topbar">
        <a class="layout-topbar-logo" routerLink="/">
            <span style="font-weight: 700; font-size: 1.5rem; color: var(--p-primary-color);">PRIMENG</span>
        </a>

        <div class="layout-topbar-menu">
            <p-button [icon]="isDarkTheme ? 'pi pi-moon' : 'pi pi-sun'" [rounded]="true" [text]="true" (click)="toggleTheme()" severity="secondary"></p-button>
            <p-button icon="pi pi-user" [rounded]="true" [text]="true" severity="secondary"></p-button>
            <p-button icon="pi pi-cog" [rounded]="true" [text]="true" severity="secondary"></p-button>
        </div>
    </div>

    <div class="layout-sidebar">
        <ul class="layout-menu">
            <li class="layout-menuitem-category" style="padding: 1rem 0 0.5rem 0; font-weight: 700; font-size: 0.75rem; color: var(--p-text-muted-color); text-transform: uppercase;">Home</li>
            <li>
                <a routerLink="/" routerLinkActive="active-route" [routerLinkActiveOptions]="{exact:true}" style="display: flex; align-items: center; padding: 0.75rem 1rem; color: var(--p-text-color); text-decoration: none; border-radius: 6px; transition: background-color 0.2s;">
                    <i class="pi pi-fw pi-home layout-menuitem-icon" style="margin-right: 0.5rem;"></i>
                    <span class="layout-menuitem-text">Dashboard</span>
                </a>
            </li>

            <li class="layout-menuitem-category" style="padding: 1.5rem 0 0.5rem 0; font-weight: 700; font-size: 0.75rem; color: var(--p-text-muted-color); text-transform: uppercase;">Entities</li>
            <li>
                <a routerLink="/person" routerLinkActive="active-route" style="display: flex; align-items: center; padding: 0.75rem 1rem; color: var(--p-text-color); text-decoration: none; border-radius: 6px; transition: background-color 0.2s;">
                    <i class="pi pi-fw pi-user layout-menuitem-icon" style="margin-right: 0.5rem;"></i>
                    <span class="layout-menuitem-text">Person</span>
                </a>
            </li>
            <li>
                <a routerLink="/vehicle" routerLinkActive="active-route" style="display: flex; align-items: center; padding: 0.75rem 1rem; color: var(--p-text-color); text-decoration: none; border-radius: 6px; transition: background-color 0.2s;">
                    <i class="pi pi-fw pi-car layout-menuitem-icon" style="margin-right: 0.5rem;"></i>
                    <span class="layout-menuitem-text">Vehicle</span>
                </a>
            </li>

            <li class="layout-menuitem-category" style="padding: 1.5rem 0 0.5rem 0; font-weight: 700; font-size: 0.75rem; color: var(--p-text-muted-color); text-transform: uppercase;">Admin</li>
            <li>
                <a routerLink="/operation_names" routerLinkActive="active-route" style="display: flex; align-items: center; padding: 0.75rem 1rem; color: var(--p-text-color); text-decoration: none; border-radius: 6px; transition: background-color 0.2s;">
                    <i class="pi pi-fw pi-cog layout-menuitem-icon" style="margin-right: 0.5rem;"></i>
                    <span class="layout-menuitem-text">Operation Names</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="layout-main-container">
        <div class="layout-main">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
